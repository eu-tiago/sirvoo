<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <!-- Mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- SEO -->
    <title>Sirvo - Gestão de Escalas para Igrejas</title>

    <meta
      name="description"
      content="Sistema completo para gestão de escalas, voluntários, ministérios, cultos e eventos da sua igreja. Organize equipes, confirme presença e reduza faltas com o Sirvo."
    />

    <meta
      name="keywords"
      content="gestão de escalas igreja, aplicativo para igrejas, software para igrejas, escala de voluntários, ministério de louvor, gestão de ministérios, organização de cultos, gestão de voluntários igreja, app para igreja, escalas de culto"
    />

    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <meta name="author" content="Sirvo" />

    <link rel="canonical" href="https://sirvo.app" />

    <!-- Theme -->
    <meta name="theme-color" content="#252B7E" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Apple PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <meta name="apple-mobile-web-app-title" content="Sirvo" />

    <!-- Icons -->
    <link rel="apple-touch-icon" href="/icons/icon-512.png" />

    <link rel="icon" type="image/png" href="/icons/icon-512.png" />

    <link rel="shortcut icon" href="/icons/icon-512.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />

    <meta property="og:locale" content="pt_BR" />

    <meta property="og:site_name" content="Sirvo" />

    <meta property="og:url" content="https://sirvo.app" />

    <meta property="og:title" content="Sirvo - Gestão de Escalas para Igrejas" />

    <meta
      property="og:description"
      content="Sistema completo para gestão de escalas, ministérios, equipes e voluntários para igrejas."
    />

    <meta property="og:image" content="https://sirvo.app/icons/icon-512.png" />

    <meta property="og:image:width" content="512" />

    <meta property="og:image:height" content="512" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:site" content="@sirvo_app" />

    <meta name="twitter:title" content="Sirvo - Gestão de Escalas para Igrejas" />

    <meta
      name="twitter:description"
      content="Sistema completo para gestão de escalas, ministérios, equipes e voluntários."
    />

    <meta name="twitter:image" content="https://sirvo.app/icons/icon-512.png" />

    <!-- SoftwareApplication Schema -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Sirvo",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web, Android, iOS",
        "url": "https://sirvo.app",
        "description": "Sistema de gestão de escalas, voluntários e ministérios para igrejas.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "BRL"
        },
        "publisher": {
          "@type": "Organization",
          "name": "Sirvo"
        }
      }
    </script>

    <!-- Organization Schema -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Sirvo",
        "url": "https://sirvo.app",
        "logo": "https://sirvo.app/icons/icon-512.png"
      }
    </script>

    <style>
      :root {
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
      }

      * {
        box-sizing: border-box;
      }

      html {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      #root {
        min-height: 100vh;
        min-height: 100dvh;
      }

      /* Safe Areas */

      .pt-safe {
        padding-top: var(--safe-top);
      }

      .pb-safe {
        padding-bottom: var(--safe-bottom);
      }

      .safe-area {
        padding-top: var(--safe-top);
        padding-right: var(--safe-right);
        padding-bottom: var(--safe-bottom);
        padding-left: var(--safe-left);
      }

      /* Melhor experiência touch */

      button,
      a,
      input,
      select,
      textarea {
        touch-action: manipulation;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
